name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: CLI smoke (non-UTF-8 locale — guards the --help/--notice mojibake fix)
        env:
          LC_ALL: C
          LANG: C
        run: |
          python -c "import gakkari, gakkari.app, gakkari.ui.main_screen"
          python -m gakkari --help
          python -m gakkari --notice
      - name: Tests
        run: pytest -q
